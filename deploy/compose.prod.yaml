# Production overlay. Used by deploy/deploy.sh together with backend/compose.yaml:
#   docker compose -f backend/compose.yaml -f deploy/compose.prod.yaml --profile ai up -d
# Relative paths resolve from backend/ (the first file's folder).
# The host's nginx terminates HTTPS and proxies to the loopback ports below, so this stack never
# takes ports 80/443 or 8000 from other sites on the server.
services:
  postgres:
    restart: unless-stopped
  api:
    restart: unless-stopped
    # Replaces any host port in backend/compose.yaml. 8010 stays public for the phone's HTTP fallback.
    ports: !override
      - "127.0.0.1:8410:8000"
      - "8010:8000"
  ollama:
    restart: unless-stopped
  ocr:
    restart: unless-stopped
  frontend:
    build: ../frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:3410:3000"
    depends_on:
      - api
