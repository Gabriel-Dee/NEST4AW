<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 860" width="1400" height="860" font-family="Inter, -apple-system, Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3D5245"/>
    </marker>
    <style>
      .t{font-size:22px;font-weight:700;fill:#13261B}
      .s{font-size:15px;fill:#3D5245}
      .tag{font-size:13px;font-weight:700;letter-spacing:.08em;fill:#17703F}
      .l{font-size:13px;fill:#3D5245}
      .ln{stroke:#3D5245;stroke-width:2;fill:none;marker-end:url(#a)}
      .bi{stroke:#3D5245;stroke-width:2;fill:none;marker-start:url(#a);marker-end:url(#a)}
      .dash{stroke-dasharray:6 5}
    </style>
  </defs>

  <rect width="1400" height="860" fill="#FAF8F3"/>
  <text x="40" y="52" font-size="30" font-weight="800" fill="#13261B">Epic Cure · Medically Tailored Groceries</text>
  <text x="40" y="80" class="s">High-level architecture</text>

  <!-- Clients -->
  <text x="40" y="128" class="tag">CLIENTS</text>
  <rect x="40" y="140" width="380" height="150" rx="18" fill="#FFFFFF" stroke="#CFDCD3" stroke-width="2"/>
  <text x="64" y="180" class="t">Shopper app</text>
  <text x="64" y="208" class="s">React Native · Expo (iOS / Android)</text>
  <text x="64" y="234" class="s">expo-camera: barcode + store QR</text>
  <text x="64" y="260" class="s">Scan · Cart · Recipes · Checkout QR / code</text>

  <rect x="40" y="320" width="380" height="150" rx="18" fill="#FFFFFF" stroke="#CFDCD3" stroke-width="2"/>
  <text x="64" y="360" class="t">Staff web app</text>
  <text x="64" y="388" class="s">Next.js · React · Tailwind</text>
  <text x="64" y="414" class="s">html5-qrcode: scan checkout QR</text>
  <text x="64" y="440" class="s">Checkout review · Warehouse · Kiosk QR</text>

  <!-- External data -->
  <text x="40" y="560" class="tag">PRODUCT DATA</text>
  <rect x="40" y="572" width="380" height="96" rx="18" fill="#FFFFFF" stroke="#CFDCD3" stroke-width="2" stroke-dasharray="6 5"/>
  <text x="64" y="610" class="t">Open Food Facts API</text>
  <text x="64" y="638" class="s">Barcode lookup for unknown products</text>
  <rect x="40" y="690" width="380" height="96" rx="18" fill="#FFFFFF" stroke="#CFDCD3" stroke-width="2" stroke-dasharray="6 5"/>
  <text x="64" y="728" class="t">USDA FoodData Central</text>
  <text x="64" y="756" class="s">Reference nutrient data</text>

  <!-- Server frame -->
  <rect x="500" y="110" width="860" height="700" rx="26" fill="#EEF4EF" stroke="#17703F" stroke-width="2.5" stroke-dasharray="10 6"/>
  <text x="528" y="146" class="tag">SELF-HOSTED SERVER · DOCKER COMPOSE</text>

  <!-- FastAPI -->
  <rect x="528" y="166" width="500" height="390" rx="20" fill="#FFFFFF" stroke="#17703F" stroke-width="2.5"/>
  <text x="556" y="208" class="t">Backend API</text>
  <text x="556" y="234" class="s">Python · FastAPI · JWT roles + visit tokens</text>

  <rect x="556" y="256" width="444" height="116" rx="14" fill="#E2F2E7" stroke="#17703F" stroke-width="2"/>
  <text x="578" y="290" font-size="18" font-weight="800" fill="#0F5A31">Rules engine · System of Record</text>
  <text x="578" y="316" class="s">Deterministic green / yellow / red</text>
  <text x="578" y="340" class="s">FDA sodium · ADA diabetes · KDOQI kidney · allergens</text>
  <text x="578" y="362" class="l">Decides every safety color. No AI involved.</text>

  <rect x="556" y="388" width="214" height="142" rx="14" fill="#F6F8F6" stroke="#CFDCD3" stroke-width="2"/>
  <text x="574" y="420" font-size="17" font-weight="700" fill="#13261B">Shopping</text>
  <text x="574" y="446" class="l">Check-in · Scan</text>
  <text x="574" y="468" class="l">Cart · Stock by store</text>
  <text x="574" y="490" class="l">Checkout QR / 4-digit</text>
  <text x="574" y="512" class="l">code · Staff review</text>

  <rect x="786" y="388" width="214" height="142" rx="14" fill="#F6F8F6" stroke="#CFDCD3" stroke-width="2"/>
  <text x="804" y="420" font-size="17" font-weight="700" fill="#13261B">Recipes</text>
  <text x="804" y="446" class="l">Asks the model for ideas</text>
  <text x="804" y="468" class="l">Re-checks every item</text>
  <text x="804" y="490" class="l">with the rules engine</text>
  <text x="804" y="512" class="l">Fallback: recipe library</text>

  <!-- AI services -->
  <text x="1060" y="192" class="tag">AI SERVICES · LOCAL</text>
  <rect x="1060" y="204" width="276" height="170" rx="20" fill="#FFFFFF" stroke="#7A5BC7" stroke-width="2.5"/>
  <text x="1084" y="242" class="t">Ollama</text>
  <text x="1084" y="268" class="s">qwen2.5:1.5b (open source)</text>
  <text x="1084" y="296" font-size="15" font-weight="700" fill="#5B3FA8">System of Intelligence</text>
  <text x="1084" y="322" class="l">Recipe suggestions only</text>
  <text x="1084" y="344" class="l">Gets diet flags + product IDs</text>

  <rect x="1060" y="396" width="276" height="160" rx="20" fill="#FFFFFF" stroke="#7A5BC7" stroke-width="2.5"/>
  <text x="1084" y="434" class="t">OCR worker</text>
  <text x="1084" y="460" class="s">FastAPI · PaddleOCR</text>
  <text x="1084" y="486" class="s">zxing-cpp barcode reader</text>
  <text x="1084" y="514" class="l">Reads labels and barcodes</text>
  <text x="1084" y="536" class="l">from photos</text>

  <!-- Database -->
  <rect x="528" y="600" width="808" height="180" rx="20" fill="#FFFFFF" stroke="#17703F" stroke-width="2.5"/>
  <text x="556" y="642" class="t">PostgreSQL 16</text>
  <text x="556" y="668" class="s">pgcrypto: names and phone numbers encrypted at rest</text>
  <g font-size="15" fill="#13261B" font-weight="600">
    <rect x="556" y="690" width="140" height="62" rx="12" fill="#F6F8F6" stroke="#CFDCD3"/><text x="626" y="727" text-anchor="middle">Clients</text>
    <rect x="712" y="690" width="140" height="62" rx="12" fill="#F6F8F6" stroke="#CFDCD3"/><text x="782" y="727" text-anchor="middle">Products</text>
    <rect x="868" y="690" width="140" height="62" rx="12" fill="#F6F8F6" stroke="#CFDCD3"/><text x="938" y="727" text-anchor="middle">Stock · Stores</text>
    <rect x="1024" y="690" width="140" height="62" rx="12" fill="#F6F8F6" stroke="#CFDCD3"/><text x="1094" y="727" text-anchor="middle">Visits · Carts</text>
    <rect x="1180" y="690" width="140" height="62" rx="12" fill="#F6F8F6" stroke="#CFDCD3"/><text x="1250" y="727" text-anchor="middle">Rules matrix</text>
  </g>

  <!-- Connections -->
  <path class="bi" d="M420,215 L528,240"/>
  <text x="430" y="196" class="l">REST · JSON</text>
  <path class="bi" d="M420,395 L528,360"/>
  <text x="436" y="408" class="l">REST · JSON</text>

  <path class="ln dash" d="M528,520 C470,560 450,600 420,620"/>
  <path class="ln dash" d="M528,540 C480,640 460,700 420,738"/>

  <path class="bi" d="M1000,458 L1060,300"/>
  <path class="bi" d="M1028,476 L1060,476"/>

  <path class="bi" d="M778,556 L778,600"/>
  <text x="790" y="584" class="l">SQL</text>
</svg>
