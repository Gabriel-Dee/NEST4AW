services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: nest
      POSTGRES_USER: nest
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nest -d nest"]
      interval: 5s
      timeout: 5s
      retries: 20
  seed:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    env_file: .env
    environment:
      DATABASE_URL: postgresql://nest:${POSTGRES_PASSWORD}@postgres:5432/nest
    command: ["python", "-m", "seed.load"]
    depends_on:
      postgres:
        condition: service_healthy
  api:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    env_file: .env
    environment:
      DATABASE_URL: postgresql://nest:${POSTGRES_PASSWORD}@postgres:5432/nest
      OLLAMA_URL: http://ollama:11434
      OCR_URL: http://ocr:8001
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      seed:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 5
  ollama:
    image: ollama/ollama:0.40.16
    profiles: [ai]
    environment:
      OLLAMA_NO_CLOUD: '1'
    volumes:
      - ollama-data:/root/.ollama
  ocr:
    profiles: [ai]
    build:
      context: ..
      dockerfile: backend/Dockerfile
      args:
        INSTALL_OCR: 'true'
    env_file: .env
    environment:
      PADDLE_PDX_CACHE_HOME: /home/nest/.paddlex
      OCR_TIMEOUT: '45'
    command: ["uvicorn", "app.ocr_worker:app", "--host", "0.0.0.0", "--port", "8001", "--no-access-log"]
    volumes:
      - ocr-data:/home/nest/.paddlex
volumes:
  postgres-data:
  ollama-data:
  ocr-data:
