[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "nest4aw-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.121,<1", "uvicorn[standard]>=0.30,<1", "psycopg[binary,pool]>=3.2,<4", "pydantic-settings>=2.6,<3", "pwdlib[argon2]>=0.2,<1", "PyJWT>=2.9,<3", "httpx>=0.27,<1", "python-multipart>=0.0.18", "Pillow>=11,<13", "zxing-cpp>=2.3,<4"]

[project.optional-dependencies]
test = ["pytest>=8,<10", "hypothesis>=6", "ruff>=0.9"]
ocr = ["paddleocr>=3.0,<4", "paddlepaddle>=3.0,<4"]

[tool.setuptools.packages.find]
include = ["app*", "seed*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: requires a dedicated PostgreSQL test database", "inference: requires installed model weights and runtime"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
