[project]
name = "nest4aw"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.32",
  "psycopg[binary]>=3.2",
  "pydantic>=2",
  "pwdlib[argon2]>=0.2",
  "pyjwt>=2.9",
]

[dependency-groups]
dev = [
  "pytest>=8",
  "hypothesis>=6",
  "httpx>=0.27",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
